spring.application.name=blogApp
server.port=${PORT:8080}

# --- Database (values come from environment) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blog_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- SSL: DISABLED in production. Platform handles HTTPS. ---
server.ssl.enabled=false

# --- Cloudinary (values come from environment) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djbc3a48f}
cloudinary.api-key=${CLOUDINARY_API_KEY:968515517755445}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:CHANGE_ME}
cloudinary.folder=blog/posts

# --- Mail (values come from environment) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JWT (add this ? you had it hardcoded somewhere before) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- Swagger / springdoc ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html